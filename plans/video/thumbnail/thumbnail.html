<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFAF7;--sheet:#FFFFFF;--ink:#1B1B1F;--muted:#5C5B66;--hairline:#E6E3DC;--strong:#D5D1C7;--navy:#1E2A47;--navy-soft:#E9EDF6;--del:#B3261E;--ins:#1E5AA8}
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.frame{position:relative;width:1280px;height:720px;border-top:12px solid var(--navy);display:flex}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='180' height='180' filter='url(%23n)'/%3E%3C/svg%3E")}
.left{width:57%;padding:58px 8px 44px 62px;display:flex;flex-direction:column}
.eyebrow{font-size:19px;letter-spacing:.13em;font-weight:700;color:var(--muted)}
h1{font:700 96px/1.02 "Source Serif 4",serif;letter-spacing:-.02em;margin:26px 0 0;color:var(--ink)}
h1 .red{color:var(--del)}
.stat{margin-top:44px;display:flex;align-items:baseline;gap:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.stat .from{font-size:56px;font-weight:700;color:var(--del)}
.stat .arrow{font-size:44px;color:var(--muted)}
.stat .to{font-size:76px;font-weight:700;color:var(--ins)}
.statlabel{margin-top:6px;font-size:24px;font-weight:600;color:var(--muted)}
.pill{margin-top:auto;display:inline-flex;align-self:flex-start;align-items:center;gap:12px;background:var(--navy);color:#fff;font-size:26px;font-weight:600;padding:14px 26px;border-radius:14px}
.right{position:absolute;right:-38px;top:44px;width:560px}
.shot{width:560px;border:1px solid var(--strong);border-radius:14px;box-shadow:0 24px 60px rgba(27,27,31,.22);transform:rotate(-2.2deg);background:var(--sheet);overflow:hidden}
.shot img{display:block;width:100%}
</style></head>
<body><div class="frame"><div class="grain"></div>
<div class="left">
  <p class="eyebrow">AGENTIC CONTRACT REVIEW</p>
  <h1>AI that <span class="red">redlines</span><br>your contracts</h1>
  <div class="stat"><span class="from">1.1%</span><span class="arrow">&#8594;</span><span class="to">54.7%</span></div>
  <p class="statlabel">complete redlines vs a one-prompt baseline</p>
  <div class="pill">Real Word tracked changes</div>
</div>
<div class="right"><div class="shot"><img src="redline-crop.png" alt=""></div></div>
</div></body></html>
